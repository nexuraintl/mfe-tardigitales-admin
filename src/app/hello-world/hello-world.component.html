<div class="mfe-container">
  <div class="mfe-card">
    <div class="mfe-badge">Microfrontend</div>
    
    <h2 class="mfe-title">
      {{ nombre ? ('¡Hola, ' + nombre + '!') : saludoActual }}
    </h2>
    
    <p class="mfe-description">
      Este es un microfrontend independiente construido con Angular Elements e integrado sin dependencias del servidor PHP.
    </p>

    <!-- Sección de Input Reactivo -->
    <div class="mfe-input-group">
      <label for="nombreInput" class="mfe-label">¿Cómo te llamas?</label>
      <input 
        id="nombreInput" 
        type="text" 
        class="mfe-input" 
        [(ngModel)]="nombre" 
        placeholder="Escribe tu nombre aquí..."
        autocomplete="off"
      />
    </div>

    <!-- Sección de Controles Interactivos -->
    <div class="mfe-controls">
      <button class="mfe-btn mfe-btn-secondary" (click)="cambiarSaludo()">
        <span class="mfe-btn-icon">🌐</span> Idioma: {{ saludos[saludoActualIndex].lang }}
      </button>
      
      <button class="mfe-btn mfe-btn-primary" (click)="incrementar()">
        <span class="mfe-btn-icon">⚡</span> Clics: {{ contador }}
      </button>
    </div>

    <div class="mfe-footer">
      <span>Powered by Angular v19 & nxPlatform</span>
    </div>
  </div>
</div>
