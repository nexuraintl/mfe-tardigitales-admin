<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>JCC Tarjeta Digital</title>
  <base href="/" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <!-- Bootstrap 5.3 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  
  <!-- Google Material Icons, Material Symbols & Fonts CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <!-- 1. CARGA DINÁMICA DE WEB COMPONENTS SEGÚN ENTORNO (Local / Preprod / Prod) -->
  <script>
    (function() {
      const host = window.location.hostname;
      let cdnBase = 'https://cdn.nexura.com.co'; // Producción por defecto

      if (host === 'localhost' || host === '127.0.0.1' || host.startsWith('local-')) {
        // Entorno Local (Docker / Gateway)
        cdnBase = 'http://local-cdn.nexura.com.co';
      } else if (host.includes('preproduccion') || host.includes('qa') || host.includes('dev')) {
        // Entorno Preproducción / QA / Dev
        cdnBase = 'https://preproduccion-cdn.nexura.com.co';
      }

      // Inyectar CSS del Layout
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = `${cdnBase}/web-components/admin/v1/layout.css`;
      document.head.appendChild(link);

      // Inyectar JS del Layout (Web Components Lit)
      const script = document.createElement('script');
      script.type = 'module';
      script.src = `${cdnBase}/web-components/admin/v1/layout.js`;
      document.head.appendChild(script);
    })();
  </script>

  <!-- Bootstrap 5.3 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous" defer></script>
</head>

</body>

</html>
